<!doctype html>
<html>
<head><meta charset="utf-8"><title>PlanCard — preview</title></head>
<body>
<div class="sf-row" style="align-items:stretch">
  <div class="sf-card">
    <p class="sf-eyebrow">1 día a la semana</p>
    <h3 class="sf-card-title">Base</h3>
    <p class="sf-price">$380.000 <small>/ mes</small></p>
    <ul class="sf-list"><li>4 o 5 sesiones al mes</li><li>Rutinas para entrenar solo</li><li>Seguimiento por WhatsApp</li></ul>
    <button class="sf-btn sf-btn-secondary">Quiero este plan</button>
  </div>
  <div class="sf-card sf-card-featured">
    <span class="sf-badge">La más elegida</span>
    <p class="sf-eyebrow">2 días a la semana</p>
    <h3 class="sf-card-title">Constancia</h3>
    <p class="sf-price">$650.000 <small>/ mes</small></p>
    <ul class="sf-list"><li>8 a 10 sesiones al mes</li><li>Rutinas para entrenar solo</li><li>Seguimiento por WhatsApp</li></ul>
    <button class="sf-btn sf-btn-primary">Quiero este plan</button>
  </div>
</div>
<script></script>
</body>
</html>
